[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deeplearn-utils"
version = "0.1.0"
description = "Small, dependency-light helpers for deep-learning experiments"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["deeplearn_utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
